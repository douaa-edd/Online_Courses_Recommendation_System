{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Learn</title>
    <style>
        /* Modern Reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Color Variables */
        :root {
            --primary: #0570c7;
            /* Blue Accent */
            --dark: #1a1a1a;
            --light: #ffffff;
            --gray: #e0e0e0;
        }

        /* Navbar */
        header {
            background-color: var(--light);
            border-bottom: 2px solid var(--gray);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        nav a {
            text-decoration: none;
            color: var(--dark);
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            background-color: var(--primary);
            color: var(--light);
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary);
            color: var(--light);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Cards */
        .card {
            background: var(--light);
            border: 1px solid var(--gray);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .section-title {
            border-left: 5px solid var(--primary);
            padding-left: 1rem;
            margin: 2rem 0 1rem 0;
            font-size: 1.5rem;
            color: var(--dark);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--dark);
            color: var(--light);
            margin-top: auto;
        }

        /* Forms */
        form {
            max-width: 400px;
            margin: 0 auto;
            background: var(--light);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        form p {
            margin-bottom: 1rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>

<body>

    <header>
        <a href="{% url 'index' %}" class="logo">SD<span>Learn</span></a>



        <nav>
            <a href="{% url 'index' %}">Home</a>
            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'my_courses' %}">My Courses</a>
            <a href="{% url 'course_list' %}">All Courses</a>
            <a href="{% url 'profile' %}">Profile</a>
            <form action="{% url 'logout' %}" method="post"
                style="display:inline; padding:0; box-shadow:none; margin:0; width:auto; background:none;">
                {% csrf_token %}
                <button type="submit"
                    style="background:none; border:none; padding:0; margin:0; margin-left:20px; color:#333; font-weight:500; cursor:pointer; font-family:inherit; font-size:inherit;">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}" class="btn">Register</a>
            {% endif %}
        </nav>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 SD Learn. Advanced Course Recommendation System.</p>
    </footer>

</body>

</html>
