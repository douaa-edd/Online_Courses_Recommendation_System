{% extends 'recommender/base.html' %}

{% block content %}
<div style="text-align: center; padding: 4rem 0;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">Welcome to <span style="color:var(--primary)">SD Learn</span></h1>
    <p style="font-size: 1.2rem; color: #666; margin-bottom: 2rem;">
        The smartest way to discover courses tailored just for you.
    </p>

    {% if not user.is_authenticated %}
    <a href="{% url 'register' %}" class="btn" style="padding: 1rem 2rem; font-size: 1.2rem;">Start Learning</a>
    <a href="{% url 'login' %}" class="btn btn-outline"
        style="padding: 1rem 2rem; font-size: 1.2rem; margin-left: 1rem;">Login</a>
    {% else %}
    <a href="{% url 'dashboard' %}" class="btn" style="padding: 1rem 2rem; font-size: 1.2rem;">Go to Dashboard</a>
    {% endif %}
</div>
{% endblock %}
